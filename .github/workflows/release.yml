name: Release

# Cut a release by pushing a `vX.Y.Z` tag; the workflow does the rest:
#   1. checks the tag matches Cargo.toml,
#   2. attaches a stable source tarball (git archive) to the GitHub release,
#   3. builds the x86_64 binary and attaches it with a checksum.
#
# Unlike GitHub's auto-generated /archive/ tarballs, a release asset's bytes
# (and therefore its checksum) do not change, so downstream packagers can pin
# it safely.
#
# AUR publishing is not available while Arch restricts new accounts and package
# pushes. `packaging/aur/hyprview-git` remains a VCS package for local builds,
# but the release assets are the primary distribution path.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Build source tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate version
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$cargo_version" ] || [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version '${cargo_version}'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build stable source tarball
        id: tarball
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          tarball="hyprview-${version}.tar.gz"
          # --prefix keeps the extracted directory identical to GitHub's
          # /archive/ tarball, so any PKGBUILD's `cd "$pkgname-$pkgver"` is valid.
          git archive --format=tar.gz --prefix="hyprview-${version}/" -o "$tarball" HEAD
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Built ${tarball} (sha256 ${sha256})"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          tarball="hyprview-${version}.tar.gz"
          if gh release view "v${version}" >/dev/null 2>&1; then
            gh release upload "v${version}" "$tarball" --clobber
          else
            gh release create "v${version}" "$tarball" \
              --title "v${version}" \
              --generate-notes
          fi

  binary:
    name: Build x86_64 binary
    needs: source
    # Pin an older runner so the dynamically linked binary keeps a reasonably
    # old glibc baseline; ubuntu-latest moves forward over time.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libpango1.0-dev pkg-config

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        run: |
          set -euo pipefail
          version="${{ needs.source.outputs.version }}"
          asset="hyprview-x86_64-unknown-linux-gnu"
          rm -rf dist
          mkdir -p dist/hyprview/docs
          cp target/release/hyprview README.md LICENSE config.example.toml dist/hyprview/
          cp docs/configuration.md docs/development.md dist/hyprview/docs/
          tar -C dist -czf "dist/${asset}.tar.gz" hyprview
          (cd dist && sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256")
          echo "Built ${asset}.tar.gz for hyprview ${version}"

      - name: Upload binary assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.source.outputs.version }}"
          asset="hyprview-x86_64-unknown-linux-gnu"
          gh release upload "v${version}" \
            "dist/${asset}.tar.gz" \
            "dist/${asset}.tar.gz.sha256" \
            --clobber
