[package]
name = "hyprview"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hyprview"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
bitflags = "2"
cairo-rs = { version = "0.22", features = ["png"] }
pango = "0.22"
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libc = "0.2"
wayland-cursor = "0.31"
freedesktop-icons = "0.4.0"
resvg = "0.49.0"
usvg = "0.49.0"
tiny-skia = "0.12.0"
