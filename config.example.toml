# hyprview example configuration
# Copy to ~/.config/hyprview/config.toml and edit as needed.
# All keys are optional — omitted keys fall back to the defaults shown here.

# ── Appearance ────────────────────────────────────────────────────────────────

[appearance]

# Font used for window class / title labels inside each card.
font = "Sans 11"

# Font used for workspace number / name labels at the top of each card.
label_font = "Sans Bold 13"

# Base font family for the hover tooltip (size and weight are appended automatically).
tooltip_font = "Sans"

# Gap between workspace cards, and between cards and the screen edge (px).
card_padding = 24.0

# Corner radius of workspace cards (px).
card_radius = 12.0

# Maximum card width and height (px). Cards shrink to fit the screen but
# never grow beyond these values.
max_card_width  = 480.0
max_card_height = 320.0

# Height reserved for the workspace label at the top of each card (px).
label_height = 32.0

# Padding between a card's edge and the window thumbnail area (px).
thumb_padding = 8.0

# Width of the selection highlight border drawn around the active card (px).
select_border = 3.0
window_gap    = 4.0    # gap between adjacent window thumbnails (px); border sits in this space

# Draw each window's app icon in the bottom-right corner of its thumbnail.
show_app_icons = true

# Size (px) of the app icon drawn on each window thumbnail.
icon_size = 20.0

# ── Colors ────────────────────────────────────────────────────────────────────
# Colors can be written as:
#   "#rrggbb"   — hex RGB, fully opaque
#   "#rrggbbaa" — hex RGBA (aa = alpha, ff = opaque, 80 = 50% transparent)
#   [r, g, b, a] — float array, each value in 0.0–1.0

[colors]

# Full-screen dim overlay drawn behind all workspace cards.
background = "#000000bf"       # black at ~75% opacity

# Workspace card background fill.
card = "#1f1f26f2"

# Border drawn around the currently selected card.
selection = "#6699ffe6"

# Workspace number / name label text.
label = "#d9d9e6ff"

# "(empty)" text shown in workspaces with no windows.
empty_label = "#80808094"      # grey, semi-transparent

# Window class / title text drawn over thumbnails or placeholder rects.
window_label = "#ffffffe6"

# Coloured border drawn around the window that will be moved when you press 'm'.
# Set the alpha to 00 to disable the indicator entirely.
active_window = "#ffbf33f2"    # amber

# Subtle border drawn around every window thumbnail.
window_border = "#ffffff26"

# Border drawn around the window thumbnail currently under the cursor.
hover_border = "#ffffff99"

# Brightness tint overlaid on the hovered window thumbnail.
# Set the alpha to 00 to disable the fill and keep only the border.
hover_overlay = "#ffffff26"

# Hover tooltip colors.
tooltip_background = "#0f0f1af2"
tooltip_name       = "#fffff2f2"   # app name (bold)
tooltip_class      = "#b2b2bfcc"   # full class, shown when it differs from the app name
tooltip_title      = "#d9d9e7e5"   # window title

# ── Keybindings ───────────────────────────────────────────────────────────────
# Each action accepts a single key name or an array of key names.
# Supported names: "Escape", "Return", "Left", "Right", "Up", "Down", "Tab", "space",
# or any single printable character ("h", "j", "k", "l", "m", etc.).
# Number keys 1–9 always jump directly to that workspace and cannot be remapped.

[keybindings]
close       = "Escape"
confirm     = "Return"
left        = ["Left", "h"]
right       = ["Right", "l"]
up          = ["Up", "k"]
down        = ["Down", "j"]
move_window   = "m"
close_window  = "Delete"   # close the hovered window (or the single filter match)
tab           = "Tab"      # cycle-highlight windows across all workspaces; hold Shift to reverse

# ── Behavior ──────────────────────────────────────────────────────────────────

[behavior]

# Skip capturing live window thumbnails. Workspaces will show coloured
# placeholder rectangles instead. Faster to open and uses less memory.
no_preview = false

# After pressing 'm' to move the active window to another workspace,
# also switch to that workspace (and close the overlay).
# Set to false to move silently and stay on the current workspace.
switch_on_move = true

# Enable mouse navigation inside the overlay:
#   - hover a workspace card to select it
#   - left-click   → switch to that workspace
#   - right-click  → move the active window to that workspace
# The `--allow-mouse` CLI flag forces this on regardless of the value here.
allow_mouse = false

# Show workspace cards that have no open windows.
# Default is false — empty workspaces are hidden.
show_empty_workspaces = false
